# Publish the npm packages for a Coco MCP release. Runs when the main
# repository's release workflow says a release is out, by hand with a
# version, or every hour as a fallback: when the latest release is not on
# npm yet, it is fetched by checksum and published, four platform packages
# then the umbrella. Nothing is built here.
#
# npm trusts this workflow as the packages' publisher (trusted publishing,
# OpenID Connect): no token is stored anywhere, and the provenance of each
# package names this run.
name: publish

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "The release to publish, as X.Y.Z"
        required: true
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  id-token: write

# A triggered run and the hourly one never publish at the same time.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships 10.
      - name: npm with trusted publishing
        run: npm install --global npm@latest && npm --version
      - name: Version to publish
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.version || github.event.client_payload.version }}
        run: |
          if [ -n "$WANTED" ]; then
            version="$WANTED"
          else
            version=$(gh api repos/camiloazula/coco-mcp/releases/latest --jq .tag_name | sed 's/^v//')
          fi
          published=$(npm view coco-mcp version 2>/dev/null || echo none)
          echo "release $version, on npm: $published"
          if [ "$version" = "$published" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the binaries
        if: steps.pick.outputs.skip != 'true'
        run: scripts/fetch.sh "${{ steps.pick.outputs.version }}"
      - name: Publish
        if: steps.pick.outputs.skip != 'true'
        run: scripts/publish.sh --provenance
